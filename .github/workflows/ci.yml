name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: WebApp — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # @supabase/*, camera-controls and unpdf require node >= 22
      # The viewer runs on That Open's private beta engine (@thatopen-platform/*, since 2026-09-24): npm needs the
      # founder's npm token, kept as the repository secret THATOPEN_NPM_TOKEN (never in the repo — WebApp/.npmrc is
      # git-ignored). Without it the install is refused by name instead of a bare 404.
      - name: npm login for the private @thatopen-platform engine
        env:
          NPM_TOKEN: ${{ secrets.THATOPEN_NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The repository secret THATOPEN_NPM_TOKEN is not set, so the private @thatopen-platform engine cannot be installed (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo '@thatopen-platform:registry=https://registry.npmjs.org/' > .npmrc
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> .npmrc # npm expands NPM_TOKEN itself; the value is never written or echoed
      - run: npm install
        env:
          NPM_TOKEN: ${{ secrets.THATOPEN_NPM_TOKEN }}
      - run: npm run test
      - run: npm run build

  addin:
    name: SentinelAddin — build (net8 targets)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # net8 targets build on the plain .NET SDK. 2021–2024 (net48) and 2027 (net10)
        # need extra SDK/reference setup — add them here once the runner is provisioned.
        revit: [2025, 2026]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build SentinelAddin -c Release -p:RevitVersion=${{ matrix.revit }} -p:DeployToRevit=false
      - name: Revit-free checks (fix-in-place + naming + org + snapshot + gate + ghost standards + ledger events + heal + publish + roi + docpin)
        if: matrix.revit == 2026
        run: |
          dotnet run --project tools/fixplace-check
          dotnet run --project tools/naming-check
          dotnet run --project tools/org-check
          dotnet run --project tools/snapshot-check
          dotnet run --project tools/gate-check
          dotnet run --project tools/ghost-standards-check
          dotnet run --project tools/heal-check
          dotnet run --project tools/event-check
          dotnet run --project tools/publish-check
          dotnet run --project tools/roi-check
          dotnet run --project tools/docpin-check
