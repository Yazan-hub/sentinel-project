name: CI

on:
  push:
  pull_request:

# The job token reads the repository only; no checkout keeps it in .git/config (SEC-4).
permissions:
  contents: read

jobs:
  web:
    name: WebApp — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22 # @supabase/*, camera-controls and unpdf require node >= 22
      # The viewer runs on That Open's private beta engine (@thatopen-platform/*, since 2026-09-24). npm needs That Open's
      # shared Founders npm token, which they rotate. CI asks That Open for the current one on every run, with the founder's
      # That Open login (the repository secret THATOPEN_ACCESS_TOKEN, which does not expire), so a rotation needs nobody.
      # THATOPEN_NPM_TOKEN (a fixed npm token) is the fallback while the login secret is not set. Never in the repo:
      # WebApp/.npmrc is git-ignored and deleted after the install.
      - name: npm login for the private @thatopen-platform engine
        env:
          THATOPEN_ACCESS_TOKEN: ${{ secrets.THATOPEN_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.THATOPEN_NPM_TOKEN }}
        run: |
          if [ -n "$THATOPEN_ACCESS_TOKEN" ]; then
            node scripts/refresh-beta-npmrc.mjs # writes .npmrc from That Open's reply; prints no token
          elif [ -n "$NPM_TOKEN" ]; then
            echo "::warning::THATOPEN_ACCESS_TOKEN is not set, so CI uses the fixed THATOPEN_NPM_TOKEN, which breaks when That Open rotates it."
            echo '@thatopen-platform:registry=https://registry.npmjs.org/' > .npmrc
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> .npmrc # npm expands NPM_TOKEN itself; the value is never written or echoed
          else
            echo "::error::Neither THATOPEN_ACCESS_TOKEN nor THATOPEN_NPM_TOKEN is set, so the private @thatopen-platform engine cannot be installed (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      # SEC-5 (S33): no dependency's install script runs while the token is in the environment, and its .npmrc is gone before
      # anything else runs; the one build step the web app needs at install (the fragments worker) runs after, without it.
      - run: npm install --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.THATOPEN_NPM_TOKEN }}
      - run: rm -f .npmrc
      - run: npm run prepare
      # MA-7-1: banned or unknown licences fail here; pending ones warn (D-7-16). Runs after .npmrc is gone, so no token is in its environment.
      - run: node ../tools/licence-check/check.mjs
      - run: npm run test
      - run: npm run build

  addin:
    name: SentinelAddin — build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the add-in deploys to (2026-10-19 evaluation): 2021–2024 build net48 against the runner's
        # .NET Framework 4.8 targeting pack, 2025–2026 net8, 2027 net10. The Revit API comes from NuGet stubs.
        revit: [2021, 2022, 2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build SentinelAddin -c Release -p:RevitVersion=${{ matrix.revit }} -p:DeployToRevit=false
      - name: Revit-free checks (fix-in-place + naming + org + snapshot + gate + ghost standards + guideline + ledger events + heal + publish + roi + docpin + promote + session)
        if: matrix.revit == 2026
        run: |
          dotnet run --project tools/fixplace-check
          dotnet run --project tools/naming-check
          dotnet run --project tools/org-check
          dotnet run --project tools/snapshot-check
          dotnet run --project tools/gate-check
          dotnet run --project tools/ghost-standards-check
          dotnet run --project tools/heal-check
          dotnet run --project tools/event-check
          dotnet run --project tools/publish-check
          dotnet run --project tools/roi-check
          dotnet run --project tools/docpin-check
          dotnet run --project tools/guideline-check
          dotnet run --project tools/promote-check
          dotnet run --project tools/session-check
